name: Robot Framework Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Instalar dependências + webdriver-manager (recomendado)
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install webdriver-manager  # gerencia chromedriver automaticamente

      # 4. Instalar xvfb (necessário para rodar Chrome sem GUI)
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # 5. Iniciar Flask em background
      - name: Start Flask app
        run: |
          xvfb-run -a python app/form_simulator.py &
          sleep 3
        shell: bash

      # 6. Rodar testes com xvfb (garante ambiente gráfico virtual)
      - name: Run Robot tests
        run: |
          xvfb-run -a robot --outputdir results/ tests/

      # 7. Salvar artefatos
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-test-results
          path: |
            results/
            log.html
            report.html
            output.xml